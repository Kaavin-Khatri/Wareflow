name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-ci:
    name: Web (Lint, Format, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Lint web app (ESLint)
        run: pnpm --filter web lint

      - name: Run unit tests (Vitest)
        run: pnpm --filter web test

      - name: Build web application (Next.js)
        run: pnpm --filter web build

  api-ci:
    name: API (Lint, Format, Test with Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt

      - name: Lint API (Ruff check)
        working-directory: apps/api
        run: ruff check app/ tests/

      - name: Check formatting (Ruff format)
        working-directory: apps/api
        run: ruff format --check app/ tests/

      - name: Run unit tests with coverage (Pytest)
        working-directory: apps/api
        run: pytest --cov=app --cov-report=term-missing
