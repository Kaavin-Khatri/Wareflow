name: Automated Database Backup & 14-Day Retention

on:
  schedule:
    # Daily at 02:00 UTC (07:30 AM IST)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: Backup Supabase Database & Enforce Retention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pip install httpx python-dotenv sqlalchemy psycopg[binary]

      - name: Execute Backup & Upload to Supabase Storage
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/backup.py --output-dir ./backups

      - name: Upload Backup Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 14
